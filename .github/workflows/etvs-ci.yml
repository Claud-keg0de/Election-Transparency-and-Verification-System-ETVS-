name: ETVS PostgreSQL verification

on:
  push:
    branches: ["main", "feature/ballot-security", "integration/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etvs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d etvs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ETVS_DB_HOST: localhost
      ETVS_DB_PORT: "5432"
      ETVS_DB_NAME: etvs
      ETVS_DB_USER: postgres
      ETVS_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip "psycopg[binary]"

      - name: Validate Python syntax
        run: python -m py_compile seed.py audit_engine.py verify_project.py

      - name: Create PostgreSQL schema
        run: psql postgresql://postgres:postgres@localhost:5432/etvs -v ON_ERROR_STOP=1 -f schema.sql

      - name: Apply migrations
        run: |
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql postgresql://postgres:postgres@localhost:5432/etvs -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Seed controlled ETVS dataset
        run: python seed.py --reset

      - name: Verify project contract
        run: python verify_project.py KE-PRES-2027

      - name: Run full audit
        run: python audit_engine.py KE-PRES-2027 | tee /tmp/etvs-audit.txt

      - name: Verify audit hash chain
        run: python audit_engine.py KE-PRES-2027 --verify-chain

      - name: Exercise turnout interval enforcement
        shell: bash
        run: |
          set -euo pipefail
          psql postgresql://postgres:postgres@localhost:5432/etvs -v ON_ERROR_STOP=1 <<'SQL'
          WITH inserted AS (
            INSERT INTO turnout_observations (
              election_id, polling_station_id, observation_version,
              voters_turnout, source_reference, observed_at
            )
            SELECT election_id, polling_station_id,
                   MAX(observation_version) + 1,
                   MAX(voters_turnout),
                   'CI-INTERVAL-TEST',
                   MAX(observed_at) + INTERVAL '1 minute'
            FROM turnout_observations
            WHERE election_id='KE-PRES-2027'
              AND polling_station_id='PS001'
            GROUP BY election_id, polling_station_id
            RETURNING turnout_observation_id
          )
          UPDATE ballot_accounting_observations b
          SET turnout_observation_id = inserted.turnout_observation_id
          FROM inserted
          WHERE b.election_id='KE-PRES-2027'
            AND b.polling_station_id='PS001';
          SQL
          python audit_engine.py KE-PRES-2027 | tee /tmp/etvs-interval-audit.txt
          grep -q "R021 FAILED" /tmp/etvs-interval-audit.txt

      - name: Verify hash chain after interval violation test
        run: python audit_engine.py KE-PRES-2027 --verify-chain

      - name: Exercise counterfoil database constraint
        shell: bash
        run: |
          set +e
          psql postgresql://postgres:postgres@localhost:5432/etvs -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO ballot_units (
            election_id, polling_station_id, position_id, ballot_batch_id,
            ballot_serial_number, counterfoil_serial_number, status
          )
          SELECT election_id, polling_station_id, position_id, ballot_batch_id,
                 ballot_serial_number || '-BAD', ballot_serial_number || '-MISMATCH', 'CAST'
          FROM ballot_units
          WHERE election_id='KE-PRES-2027'
          LIMIT 1;
          SQL
          test "$?" -ne 0
